project:
  type: website
  output-dir: docs
  execute-dir: project

website:
  title: "Yukon Inventory"
  description: "Central resource for the Multi-Scale Biomass Mapping and Timber Assessment in the Yukon Territory project"
  favicon: "images/logos/irss.png"
  site-url: https://Brent-Murray.github.io/DeepLearningEFI/
  repo-url: https://github.com/Brent-Murray/yukon-processing
  repo-actions: [issue]
  navbar:
    logo: "images/logos/irss.png"
    left:
      - text: Home
        href: index.qmd
      - text: Plots
        href: 01_plot_generation.qmd
      - text: lidR
        menu:
          - text: 1-LAS
            href: lidr/1-LAS.qmd
          - text: 2-DTM
            href: lidr/2-DTM.qmd
          - text: 3-CHM
            href: lidr/3-CHM.qmd
          - text: 4-METRICS
            href: lidr/4-METRICS.qmd
          - text: 5-LASCATALOG
            href: lidr/5-LASCATALOG.qmd
          - text: 6-ROI
            href: lidr/6-ROI.qmd
          - text: 7-ABA
            href: lidr/7-ABA.qmd
          - text: 8-ITS
            href: lidr/8-ITS.qmd
numbering: true

crossref:
  fig-prefix: "Figure"
  
format:
  html:
    theme: sandstone
    css: styles.css
    toc: true
    page-layout: full

execute:
  freeze: auto
  echo: false
  warning: false
  error: false
  cache: true
  fig-num: true

exclude:
  - "src/"